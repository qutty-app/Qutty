name: Build Flutter app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so a new stable release cannot change CI builds on its own.
  # Bump this deliberately, alongside a local `flutter pub get` and test run.
  FLUTTER_VERSION: '3.47.1'

jobs:
  checks:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  signing:
    name: Check signing setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android_release: ${{ steps.check.outputs.android_release }}
    steps:
      - name: Check for the Android release keystore
        id: check
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "android_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "android_release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android release keystore secrets are not configured, so the StoreBuild job is skipped. NotStoreBuild still builds, signed with the debug key. See docs/ci-cd.md for setup."
          fi

  # The store variant is signed with the release keystore and refuses to build
  # without it, so nothing debug-signed can reach the Play Store by accident.
  # It is skipped (not failed) until the secrets exist.
  store:
    name: Build StoreBuild
    needs: [checks, signing]
    if: needs.signing.outputs.android_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build StoreBuild (signed for the Play Store)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: 'true'
        run: |
          flutter build appbundle --release --dart-define=STORE_BUILD=true
          flutter build apk --release --dart-define=STORE_BUILD=true

      - name: Upload StoreBuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: qutty-StoreBuild
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    needs: [checks]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Signed by whatever the checkout has: the release keystore when the
          # secrets are configured, the debug key otherwise. Either way the APK
          # installs; it is the build for sideloading, not for the store.
          - name: NotStoreBuild
            runner: ubuntu-latest
            setup: android
            command: flutter build apk --release --dart-define=STORE_BUILD=false
            artifact: build/app/outputs/flutter-apk/app-release.apk
          # Unsigned on purpose: there is no Apple Developer account yet, so
          # these are build-verification artifacts, not installable apps.
          - name: iOS
            runner: macos-latest
            setup: apple
            command: flutter build ios --release --no-codesign
            artifact: build/ios/iphoneos/Runner.app
          - name: macOS
            runner: macos-latest
            setup: apple
            command: flutter build macos --release --no-codesign
            artifact: build/macos/Build/Products/Release/*.app
          - name: Linux
            runner: ubuntu-latest
            setup: linux
            command: flutter build linux --release
            artifact: build/linux/x64/release/bundle
          - name: Windows
            runner: windows-latest
            setup: windows
            command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - name: Web
            runner: ubuntu-latest
            setup: web
            command: flutter build web --release
            artifact: build/web
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        if: matrix.setup == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Linux build dependencies
        if: matrix.setup == 'linux'
        # audioplayers_linux needs the GStreamer development files
        # (gstreamer-1.0, gstreamer-app-1.0, gstreamer-audio-1.0) and
        # flutter_webrtc optionally uses libpulse for system audio capture.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libpulse-dev

      - name: Prepare Darwin build directories
        if: matrix.setup == 'apple'
        # Flutter's Swift Package Manager integration rsyncs plugin sources into
        # build/<platform>/SourcePackages without creating the parent directory,
        # which fails on a clean checkout. Create them up front.
        run: mkdir -p build/ios/SourcePackages build/macos/SourcePackages

      - name: Cache CocoaPods
        if: matrix.setup == 'apple'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ios/Pods
            ios/.symlinks
          key: cocoapods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: qutty-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
